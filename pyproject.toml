[project]
name = "visru"
version = "0.0.1"
description = "Agentic harness giving a vision-language model tools to search, zoom, measure, annotate, and verify over images and video"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# Core: the harness, the MCP server, and the CPU-only tools (view, sample_frames,
# annotate, overlay, ledger). Heavy model weights live in the [tools] extra.
dependencies = [
    "anthropic>=0.40",
    "openai>=1.40",          # openai_compat backend (vLLM)
    "mcp>=2.2",              # 2.x renamed FastMCP to MCPServer
    "typer>=0.12",           # visru run | index | report
    "pillow>=10.3",
    "numpy>=1.26",
    "av>=12.0",              # PyAV: video decoding, keyframes
    "jinja2>=3.1",           # static HTML evidence report
]

[project.optional-dependencies]
# Phase 0 model set: OWLv2 (detect), SAM 2 (segment), SigLIP (search),
# Depth Anything V2 (depth). All four load through transformers.
tools = [
    "torch>=2.4",
    "torchvision>=0.19",
    "transformers>=4.56",    # SAM 2 support landed here
    "accelerate>=0.34",
    "timm>=1.0",
    "faiss-cpu>=1.8",
    "opencv-python-headless>=4.10",
]
# Separate because PaddlePaddle pins conflict with torch stacks often enough.
ocr = ["paddleocr>=2.8", "paddlepaddle>=2.6"]
# Phase 4, pulled in only when pointmaps are needed.
geometry3d = ["vggt"]
# `python` tool: sandboxed kernel with workspace mounted read-only.
kernel = ["jupyter-client>=8.6", "ipykernel>=6.29"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
visru = "visru.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["visru"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "models: downloads and runs real model weights (opt in with --run-models)",
]
